name: Deploy STLCityRoute

# Stamps a real version (date + commit) into sw.js and index.html on every
# push to main, then publishes to GitHub Pages. The committed files keep the
# literal placeholder %%VERSION%%; only the deployed copy gets the real value.
# This is what makes the service-worker cache name change on every deploy, so
# old caches are purged and phones pick up updates.

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: ver
        run: echo "V=$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Stamp version into sw.js and index.html
        run: |
          sed -i "s/%%VERSION%%/${{ steps.ver.outputs.V }}/g" sw.js index.html

      # Safety net: fail the deploy (leaving the previous site live) if a
      # placeholder survived or sw.js has no version at all.
      - name: Verify stamping
        run: |
          if grep -q '%%VERSION%%' sw.js index.html; then
            echo "FATAL: %%VERSION%% still present after stamping"; exit 1
          fi
          grep -q "stlcityroute-${{ steps.ver.outputs.V }}" sw.js || { echo "FATAL: sw.js cache name not stamped"; exit 1; }
          echo "Stamped version ${{ steps.ver.outputs.V }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
